<html lang="en">

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#080812;
  color:white;
  font-family:monospace;
  overflow:hidden;
}

.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.window{
  width:100%;
  max-width:700px;
  min-height:560px;
  background:#121220;
  border:1px solid #ff6caf;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 40px #ff4f9a55;
}

.dots{
  display:flex;
  gap:7px;
  margin-bottom:20px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.red{background:#ff5f56}
.yellow{background:#ffbd2e}
.green{background:#27c93f}

#code{
  color:#ddd;
  line-height:1.7;
  font-size:14px;
  white-space:pre-wrap;
  min-height:350px;
}

.pink{color:#ff79c6}
.blue{color:#8be9fd}
.greenText{color:#50fa7b}
.yellowText{color:#f1fa8c}

#run{
  display:block;
  margin:auto;
  padding:14px 28px;
  border:0;
  border-radius:30px;
  background:linear-gradient(90deg,#ff4f9a,#ff86bd);
  color:white;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 0 25px #ff4f9a77;
}

#run:active{
  transform:scale(.95);
}

#surprise{
  display:none;
  text-align:center;
  animation:show 1.5s ease;
}

.photo{
  width:min(75vw,310px);
  height:min(75vw,390px);
  object-fit:cover;
  border-radius:22px;
  border:3px solid #ffd5e7;
  box-shadow:0 0 35px #ff65a8aa;
  margin:10px auto;
}

  background-size:200%;
  -webkit-background-clip:text;
  color:transparent;
  animation:shine 3s linear infinite;
}
